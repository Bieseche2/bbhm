name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fonte (DejaVu Sans)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p pkgfiles/USRDIR
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf pkgfiles/USRDIR/font.ttf

      - name: Compilar (imagem ps3dev-sdl2)
        run: |
          docker run --rm -v "$PWD":/build -w /build hldtux/ps3dev-sdl2 bash -c '
            export PS3DEV=${PS3DEV:-/usr/local/ps3dev}
            export PSL1GHT=${PSL1GHT:-/usr/local/ps3dev}
            export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
            make pkg
          '

      - name: Listar saida
        run: find . -name "*.pkg" -o -name "*.self" -o -name "*.elf" | grep -v "^./.git/"

      - uses: actions/upload-artifact@v4
        with:
          name: bbhm
          path: |
            **/*.pkg
            **/*.self
          if-no-files-found: warn
